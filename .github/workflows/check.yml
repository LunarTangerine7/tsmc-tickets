name: Check TSMC tickets

# The code lives in this (private) repo. Run history and the dashboard page are
# pushed to the public repo named in the DASHBOARD_REPO variable, which serves them on GitHub Pages.

on:
  schedule:
    # ── HOW OFTEN TO CHECK ── change this line to change the interval (minutes are past the hour, UTC).
    #   '8-58/10 * * * *'  every 10 minutes, at :08 :18 :28 :38 :48 :58
    #   '8,38 * * * *'     every 30 minutes
    #   '8 * * * *'        every hour
    # The repo is public, so Actions minutes are unlimited. GitHub's minimum is every 5 minutes,
    # and scheduled runs can start a few minutes late when GitHub is busy.
    - cron: '8-58/10 * * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Only send a test notification'
        type: boolean
        default: false

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install browser-fingerprint HTTP client
        if: ${{ !inputs.test_notify }}
        run: pip install -q -r requirements.txt

      - name: Send test notification
        if: ${{ inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 checker.py --test-notify

      - uses: actions/checkout@v4
        if: ${{ !inputs.test_notify }}
        with:
          repository: ${{ vars.DASHBOARD_REPO }}
          ssh-key: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          path: site

      - name: Check availability
        if: ${{ !inputs.test_notify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUNS_FILE: site/data/runs.json
        run: python3 checker.py

      - name: Publish dashboard and history
        if: ${{ !inputs.test_notify }}
        working-directory: site
        run: |
          cp ../docs/index.html index.html
          touch .nojekyll
          git config user.name "tsmc-checker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Run $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
