<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כרטיסים ל-TSMC</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e6e3dc;
  --good:#1f8a4c; --good-bg:#e3f4ea; --bad:#b4372f; --bad-bg:#fbe9e7;
  --wait:#9a6a00; --wait-bg:#fdf3dc; --closed:#d9d6cf; --full:#f0c9c4; --accent:#c8102e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --card:#1f1f1c; --ink:#f2f0ea; --muted:#a3a19a; --line:#33322e;
    --good:#4cc47f; --good-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1c1a;
    --wait:#f0c058; --wait-bg:#33290f; --closed:#3a3935; --full:#5a2b27;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --card:#1f1f1c; --ink:#f2f0ea; --muted:#a3a19a; --line:#33322e;
  --good:#4cc47f; --good-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1c1a;
  --wait:#f0c058; --wait-bg:#33290f; --closed:#3a3935; --full:#5a2b27;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px;font-weight:800}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
.hero{text-align:center;padding:26px 18px}
.hero .big{font-size:28px;font-weight:800;margin:6px 0}
.hero .emoji{font-size:44px;line-height:1}
.hero.none{background:var(--wait-bg);border-color:transparent}
.hero.yes{background:var(--good-bg);border-color:var(--good)}
.hero.err{background:var(--bad-bg);border-color:transparent}
.hero p{margin:4px 0;color:var(--muted)}
.btn{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:12px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{color:var(--muted);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:rtl}
.cal .h{font-size:12px;color:var(--muted);text-align:center}
.day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;background:var(--full);position:relative}
.day.closed{background:var(--closed);color:var(--muted)}
.day.available{background:var(--good);color:#fff;font-weight:800}
.day.empty{background:transparent}
.day.target{outline:3px solid var(--accent);outline-offset:1px;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.month{font-weight:700;margin:12px 0 6px}
ul.hope{list-style:none;margin:0;padding:0}
ul.hope li{display:flex;flex-direction:column;padding:9px 0;border-bottom:1px solid var(--line)}
ul.hope li:last-child{border:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.run{padding:10px 0;border-bottom:1px solid var(--line)}
.run:last-child{border:0}
.run .top{display:flex;justify-content:space-between;gap:8px}
.pill{font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.none{background:var(--wait-bg);color:var(--wait)}
.pill.yes{background:var(--good-bg);color:var(--good)}
.pill.err{background:var(--bad-bg);color:var(--bad)}
.run .det{font-size:14px;color:var(--muted);margin-top:2px}
button.more{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>🎟️ מעקב כרטיסים – מוזיאון TSMC</h1>
  <p class="sub" id="sub">טוען…</p>

  <section class="card hero" id="hero"></section>

  <section class="card">
    <h2>מצב הלוח בבדיקה האחרונה</h2>
    <div class="stats" id="stats"></div>
    <div id="cal"></div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>יש מקומות</span>
      <span><i style="background:var(--full)"></i>מלא</span>
      <span><i style="background:var(--closed)"></i>סגור</span>
      <span><i style="outline:2px solid var(--accent);background:transparent"></i>9 בנובמבר</span>
    </div>
  </section>

  <section class="card">
    <h2>🌱 יש תקווה: תאריכים שהתפנו בעבר</h2>
    <p class="muted small" id="hopeIntro"></p>
    <ul class="hope" id="hope"></ul>
  </section>

  <section class="card">
    <h2>יומן בדיקות</h2>
    <div id="runs"></div>
    <button class="more" id="more" hidden>הצג עוד</button>
  </section>

  <p class="muted small" style="text-align:center">
    המערכת בודקת אוטומטית את <a href="https://www.tsmcmoi.com/en/bookOnline_pickDate" style="color:inherit">אתר ההזמנות</a>
    ושולחת התראה לטלפון כשמתפנה מקום. הדף מתעדכן לבד.
  </p>
</main>
<script>
const TZ = 'Asia/Jerusalem';
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DAYS = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const BOOK = 'https://www.tsmcmoi.com/en/bookOnline_pickDate';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmtTime = iso => new Date(iso).toLocaleString('he-IL', {timeZone: TZ, weekday:'short', day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
const fmtDay = ymd => { const [y,m,d] = ymd.split('-').map(Number); return `${d} ב${MONTHS[m-1]}`; };
const ago = iso => {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'עכשיו';
  if (min < 60) return `לפני ${min} דקות`;
  const h = Math.round(min / 60);
  if (h < 24) return h === 1 ? 'לפני שעה' : `לפני ${h} שעות`;
  const d = Math.round(h / 24); return d === 1 ? 'אתמול' : `לפני ${d} ימים`;
};
const seats = n => n === 1 ? 'מקום אחד' : `${n} מקומות`;
const slotText = s => `${s.time} · ${s.guide_he} · ${seats(s.space)}`;

async function load() {
  let runs;
  try {
    runs = await (await fetch('data/runs.json?t=' + Date.now(), {cache: 'no-store'})).json();
  } catch (e) { runs = []; }
  render(runs);
}

function render(runs) {
  if (!runs.length) { $('sub').textContent = 'עוד לא בוצעו בדיקות.'; $('hero').innerHTML = '<p>ממתין לבדיקה הראשונה…</p>'; return; }
  const last = runs[runs.length - 1];
  const lastOk = [...runs].reverse().find(r => r.ok);
  const target = (lastOk && lastOk.target.date) || '2026-11-09';

  // Typical gap between runs, to estimate the next check.
  const gaps = runs.slice(-12).map((r, i, a) => i ? new Date(r.time) - new Date(a[i-1].time) : null).filter(Boolean).sort((a,b) => a-b);
  const gap = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 3600e3;
  const gapMin = Math.round(gap / 60000);
  const every = gapMin >= 55 && gapMin <= 65 ? 'כל שעה' : gapMin >= 60 ? `כל ${Math.round(gapMin/60)} שעות` : `כל ${gapMin} דקות`;
  $('sub').textContent = `בודק ${every} · בדיקה אחרונה ${ago(last.time)} (${fmtTime(last.time)}) · סה״כ ${runs.length} בדיקות`;

  // Hero
  const hero = $('hero');
  if (!last.ok) {
    hero.className = 'card hero err';
    hero.innerHTML = `<div class="emoji">⚠️</div><div class="big">הבדיקה האחרונה נכשלה</div>
      <p>לא הצלחנו לגשת לאתר. ננסה שוב בבדיקה הבאה.</p><p class="small">${esc(last.error)}</p>`;
  } else if (last.found) {
    const t = last.target;
    hero.className = 'card hero yes';
    hero.innerHTML = `<div class="emoji">🎉</div><div class="big">יש מקומות ל-${fmtDay(t.date)}!</div>
      ${t.slots.map(s => `<p><b>${esc(slotText(s))}</b></p>`).join('')}
      <a class="btn" href="${BOOK}" target="_blank" rel="noopener">להזמנה עכשיו ←</a>`;
  } else {
    hero.className = 'card hero none';
    hero.innerHTML = `<div class="emoji">⏳</div><div class="big">${fmtDay(last.target.date)}: עדיין מלא</div>
      <p>המערכת עובדת ובודקת ${every}. ברגע שיתפנה מקום תגיע התראה לטלפון.</p>
      <p class="small">בדיקה אחרונה: ${fmtTime(last.time)}</p>`;
  }

  // Stats + calendar from the last successful run
  if (lastOk) {
    const c = lastOk.counts;
    $('stats').innerHTML = [['יש מקומות', c.available], ['מלאים', c.full], ['סגורים', c.closed]]
      .map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
    $('cal').innerHTML = calendar(lastOk);
  }

  // Hope: every date that ever had seats, across all runs
  const seen = {};
  for (const r of runs) if (r.ok) for (const a of r.available_days) {
    const max = Math.max(...a.slots.map(s => s.space));
    const e = seen[a.date] ||= {date: a.date, times: 0, first: r.time, last: r.time, max: 0};
    e.times++; e.last = r.time; e.max = Math.max(e.max, max);
  }
  const hope = Object.values(seen).sort((a, b) => b.last.localeCompare(a.last));
  const okRuns = runs.filter(r => r.ok).length;
  $('hopeIntro').textContent = hope.length
    ? `ב-${okRuns} הבדיקות עד עכשיו נמצאו מקומות פנויים ב-${hope.length} תאריכים שונים. מקומות כן מתפנים!`
    : `ב-${okRuns} הבדיקות עד עכשיו עוד לא התפנו מקומות באף תאריך. ביטולים קורים, נמשיך לבדוק.`;
  $('hope').innerHTML = hope.slice(0, 30).map(h => `<li>
      <span><b>${fmtDay(h.date)}</b> <span class="muted small">· עד ${seats(h.max)}</span></span>
      <span class="muted small">נראה ${h.times === 1 ? 'פעם אחת' : h.times + ' פעמים'} · לאחרונה ${ago(h.last)}</span></li>`).join('');

  // Run log
  const list = [...runs].reverse();
  let shown = 0;
  const more = () => {
    shown += 25;
    $('runs').innerHTML = list.slice(0, shown).map(runRow).join('');
    $('more').hidden = shown >= list.length;
  };
  $('more').onclick = more;
  more();
}

function runRow(r) {
  let pill, det;
  if (!r.ok) { pill = '<span class="pill err">שגיאה</span>'; det = esc(r.error); }
  else {
    pill = r.found ? '<span class="pill yes">🎉 נמצאו מקומות!</span>' : '<span class="pill none">רץ בהצלחה · אין מקומות</span>';
    det = r.available_days.length
      ? 'פנוי באותו רגע: ' + r.available_days.map(a => `${fmtDay(a.date)} (${seats(Math.max(...a.slots.map(s => s.space)))})`).join(', ')
      : 'אף תאריך לא היה פנוי';
  }
  return `<div class="run"><div class="top"><span>${fmtTime(r.time)}</span>${pill}</div><div class="det">${det}</div></div>`;
}

function calendar(run) {
  const avail = new Set(run.available_days.map(a => a.date));
  const closed = new Set(run.closed_days || []);
  const start = new Date(run.site_today + 'T00:00:00Z'); start.setUTCDate(start.getUTCDate() + 1);
  const end = new Date(run.window_end + 'T00:00:00Z');
  let html = '', month = -1;
  for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    if (d.getUTCMonth() !== month) {
      if (month !== -1) html += '</div>';
      month = d.getUTCMonth();
      html += `<div class="month">${MONTHS[month]} ${d.getUTCFullYear()}</div><div class="cal">` +
        DAYS.map(x => `<div class="h">${x}</div>`).join('') + '<div class="day empty"></div>'.repeat(d.getUTCDay());
    }
    const ymd = d.toISOString().slice(0, 10);
    const cls = avail.has(ymd) ? 'available' : closed.has(ymd) ? 'closed' : 'full';
    html += `<div class="day ${cls}${ymd === run.target.date ? ' target' : ''}" title="${ymd}">${d.getUTCDate()}</div>`;
  }
  return html + '</div>';
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
